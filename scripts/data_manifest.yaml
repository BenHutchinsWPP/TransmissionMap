# data_manifest.yaml — hand-written provenance for every tiled layer
#
# One entry per `id:` in `scripts/tile_manifest.yaml` (the authoritative list
# of ids this file must match). This is the input a generated data manifest
# (a build-time "Data Credits" listing, one row per layer, with a `data_as_of`
# date) is built from — facts a script cannot derive from the data itself:
# who publishes the layer, where its landing page is, what licence governs
# redistribution, and which credits-dialog anchor its entry belongs under.
# `data_as_of` is derived by the generator:
#   - OSM layers (source_id: osm): the oldest PBF snapshot timestamp across the
#     continental extracts in data/raw/osm/*-latest.osm.pbf.
#   - Non-OSM layers with a `raw:` field: the newest mtime of the matching
#     files under the repo root.
#   - Everything else: null.
#
# Fields per entry:
#   label      human name as it would read on a credits page
#   source     upstream provider + dataset (one string; several providers if
#              the layer genuinely blends more than one)
#   url        the dataset's landing page
#   licence    the licence as stated by the provider
#   source_id  the src/registry/sources.ts LAYER_SOURCES key this layer's
#              credit is grouped under — assets/ui/ui-credits.ts appends each
#              key's layer detail to the entry carrying
#              data-source-credit="<source_id>" (or adds one), several layers
#              sharing one key by design, so this is what keeps a layer row's
#              "source" button (openSourceCredit() in ui.ts) landing on the
#              entry that carries this layer's detail.
#   raw        (optional) repo-relative path or glob to the raw download the
#              extract script reads. The generator takes the newest mtime of
#              the matching files as data_as_of. Omit when the path is not
#              unambiguously clear from the extract script.
#   edition    (optional, boundary entries only) the boundary vintage the
#              layer's region tags are joined against, as named in the docs
#              (e.g. cb_2025_us_county_500k). build_data_manifest.py passes it
#              through to data/layers/manifest.json only when present.
#
# Facts here are drawn only from docs/data-sources.md and docs/layers/<id>.md
# — never from the web or from memory of what a licence "usually" is (source_id
# is drawn from src/registry/sources.ts and the two docs the same way). Where
# those docs don't name a field with confidence, the field is the literal
# string UNKNOWN rather than a guess: a wrong licence on a public credits
# page is a defect, a blank is a one-minute fix. A layer whose provider has no
# LAYER_SOURCES entry at all (nothing to guess between) gets source_id:
# UNKNOWN too — ui-credits.ts skips rendering it rather than emit an anchor
# that resolves to no element.

layers:
  eia_generators:
    label: EIA Generators
    source: U.S. Energy Information Administration, Form EIA-860
    url: https://www.eia.gov/electricity/data/eia860/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: eia
    raw: data/raw/eia/*.xlsx

  osm_plants_polygons:
    label: OSM Plants (Polygons)
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  osm_plants_points:
    label: OSM Plants (Points)
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  hifld_substations:
    label: HIFLD Substations
    source: DHS/CISA Homeland Infrastructure Foundation-Level Data (HIFLD)
    url: https://www.arcgis.com/home/item.html?id=ef04dc8231c9491e804a008e5faa7d3a
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: hifld-substations
    raw: data/raw/hifld/electric_substations.csv

  osm_substations_points:
    label: OSM Substations (Points)
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  osm_substations_polygons:
    label: OSM Substations (Polygons)
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  osm_generators:
    label: OSM Generators
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  osm_datacenters:
    label: OSM Data Centers
    source: OpenStreetMap contributors; IM3 Open Source Data Center Atlas (PNNL/DOE)
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    # index.html anchors the IM3 enrichment credit separately under "im3", but
    # that id is a fixed extra in registry.test.ts's allowedExtras, not a
    # src/registry/sources.ts LAYER_SOURCES key — this layer's registry entry
    # (osm-datacenters) itself declares sourceId "osm".
    source_id: osm

  railroads:
    label: Railroads (BTS NARN)
    source: US DOT Bureau of Transportation Statistics (NTAD); rail geometry from the Federal Railroad Administration (FRA)
    url: https://geodata.bts.gov/datasets/usdot::north-american-rail-network-lines/about
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: bts-narn
    raw: data/raw/railroads/narn_rail_lines.geojson

  osm_pipelines_points:
    label: OSM Pipelines (Points)
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  osm_pipelines_lines:
    label: OSM Pipelines (Lines)
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  hifld_natgas_points:
    label: HIFLD Natural Gas & Petroleum Facility Points
    source: DHS/CISA Homeland Infrastructure Foundation-Level Data (HIFLD); original data from EIA
    url: https://source.coop/repositories/seerai/hifld/description/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: hifld-natgas
    raw: data/raw/hifld/natgas/*.parquet

  # Not documented in docs/data-sources.md or docs/layers/ under this id or
  # any HIFLD/EIA pipeline doc — no source, url or licence can be confirmed
  # against the two allowed references.
  eia_crude_pipelines:
    label: UNKNOWN
    source: UNKNOWN
    url: UNKNOWN
    licence: UNKNOWN
    # src/registry/pipelines.ts declares this layer's (commented-out) sourceId
    # as "eia-atlas" — the anchor is confirmable even though the provenance
    # text above is not.
    source_id: eia-atlas
    raw: data/raw/eia_petroleum/CrudeOil_Pipelines_US_EIA/*.shp

  # Same gap as eia_crude_pipelines above.
  eia_product_pipelines:
    label: UNKNOWN
    source: UNKNOWN
    url: UNKNOWN
    licence: UNKNOWN
    source_id: eia-atlas
    raw: data/raw/eia_petroleum/PetroleumProduct_Pipelines_US_EIA/*.shp

  hifld_natgas_lines:
    label: HIFLD Natural Gas & Petroleum Pipeline Lines
    source: DHS/CISA Homeland Infrastructure Foundation-Level Data (HIFLD); original data from EIA
    url: https://source.coop/repositories/seerai/hifld/description/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: hifld-natgas
    raw: data/raw/hifld/natgas/*.parquet

  countries:
    label: Countries (geoBoundaries CGAZ)
    source: geoBoundaries (William & Mary geoLab)
    url: https://www.geoboundaries.org/
    licence: CC BY 4.0 (attribution required)
    source_id: cgaz-adm0
    raw: data/raw/geoboundaries/geoBoundariesCGAZ_ADM0.zip
    edition: geoBoundaries CGAZ (main branch)

  admin1_boundaries:
    label: States / Provinces (geoBoundaries CGAZ Admin-1)
    source: geoBoundaries (William & Mary geoLab)
    url: https://www.geoboundaries.org/
    licence: CC BY 4.0 (attribution required)
    source_id: cgaz-adm1
    raw: data/raw/geoboundaries/geoBoundariesCGAZ_ADM1.zip
    edition: geoBoundaries CGAZ (main branch)

  us_states:
    label: Census States
    source: U.S. Census Bureau, TIGER/Line cartographic boundary files
    url: https://www.census.gov/geographies/mapping-files/time-series/geo/carto-boundary-file.html
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: census-states
    raw: data/raw/census_boundaries/cb_2025_us_state_500k.zip
    edition: cb_2025_us_state_500k

  us_zcta:
    label: US ZIP Codes / ZCTAs (Census)
    source: U.S. Census Bureau, TIGER/Line cartographic boundary files
    url: https://www.census.gov/geographies/mapping-files/time-series/geo/carto-boundary-file.html
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: census-zcta
    raw: data/raw/census_boundaries/cb_2020_us_zcta520_500k.zip
    edition: cb_2020_us_zcta520_500k

  nerc_regions:
    label: HIFLD NERC Regions
    source: DHS/CISA Homeland Infrastructure Foundation-Level Data (HIFLD)
    url: https://source.coop/repositories/seerai/hifld/description/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: hifld-nerc
    raw: data/raw/hifld/regions/nerc-regions.parquet
    edition: HIFLD via SeerAI parquet

  control_areas:
    label: HIFLD Control Areas (Balancing Authorities)
