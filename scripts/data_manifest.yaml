    source_id: hifld-ba
    raw: data/raw/hifld/regions/control-areas.parquet
    edition: HIFLD via SeerAI parquet

  eia_ba:
    label: EIA Balancing Authorities
    source: U.S. Energy Information Administration (EIA)
    url: https://www.arcgis.com/home/item.html?id=b1aa4dff71ca4e5aab1787a8a7568e33
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: eia-ba
    raw: data/raw/eia-ba/balancing_authorities.geojson
    edition: EIA Balancing Authorities FeatureServer

  retail_territories:
    label: HIFLD Retail Service Territories
    source: DHS/CISA Homeland Infrastructure Foundation-Level Data (HIFLD)
    url: https://source.coop/repositories/seerai/hifld/description/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: hifld-retail
    raw: data/raw/hifld/regions/retail-service-territories.parquet
    edition: HIFLD via SeerAI parquet

  tribal_lands:
    label: Tribal Lands (AIANNH)
    source: U.S. Census Bureau, TIGER/Line
    url: https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    # LAYER_SOURCES keeps this under the "hifld-tribal" id (a stable id kept
    # from before the switch to Census TIGER as the actual data source — see
    # the comment in src/registry/sources.ts).
    source_id: hifld-tribal
    raw: data/raw/aiannh/tl_2026_us_aiannh.zip

  bia_tribal_lands:
    label: Tribal Lands (BIA AIAN-LAR)
    source: Bureau of Indian Affairs (BIA)
    url: https://onemap-bia-geospatial.hub.arcgis.com/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: bia-bogs

  padus:
    label: PAD-US Protected & Managed Lands
    source: USGS Gap Analysis Project
    url: https://www.sciencebase.gov/catalog/item/652d4fc5d34e44db0e2ee45e
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: usgs-padus

  crithab:
    label: Critical Habitat (ESA)
    source: US Fish & Wildlife Service — ECOS
    url: https://ecos.fws.gov/ecp/report/table/critical-habitat.html
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: fws-crithab

  hifld_transmission_lines:
    label: HIFLD Transmission Lines
    source: DHS/CISA Homeland Infrastructure Foundation-Level Data (HIFLD)
    url: https://source.coop/repositories/seerai/hifld/description/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: hifld-power

  osm_transmission_lines:
    label: OSM Transmission Lines
    source: OpenStreetMap contributors
    url: https://www.openstreetmap.org/copyright
    licence: ODbL 1.0 (attribution + share-alike required)
    source_id: osm

  county_boundaries:
    label: County Boundaries
    source: U.S. Census Bureau, TIGER/Line cartographic boundary files
    url: https://www.census.gov/geographies/mapping-files/time-series/geo/carto-boundary-file.html
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    # Shared join infrastructure (docs/layers/boundaries.md), but the same
    # Census county boundaries the "Census Counties" layer displays — grouped
    # under the same anchor as that layer's sourceId, "census-counties".
    source_id: census-counties
    edition: cb_2025_us_county_500k

  nws_zones:
    label: NWS Zones (Forecast / Fire / Marine)
    source: NOAA National Weather Service (WSOM zone shapefiles)
    url: https://www.weather.gov/source/gis/Shapefiles/WSOM/
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    # Shared zone/county join infrastructure for live weather alerts
    # (docs/layers/nws-alerts.md), credited under the same NWS anchor as the
    # nws-alerts layer's sourceId, "noaa-nws".
    source_id: noaa-nws

  ogf_planned_transmission:
    label: OGF Planned Transmission
    source: Our Grid Future (Horizon Energy Systems)
    url: https://ourgridfuture.org
    licence: Custom — free for non-commercial use, attribution required
    source_id: ogf

  boem_wind_leases:
    label: Offshore Wind Leases (BOEM)
    source: Bureau of Ocean Energy Management (BOEM)
    url: https://www.boem.gov/renewable-energy/mapping-and-data
    licence: Public domain (US federal work, 17 U.S.C. § 105)
    source_id: boem

  # Natural Earth has no entry in src/registry/sources.ts — no layer's
  # registered sourceId names it, and it has no data-source-credit anchor in
  # index.html either (it is credited only in docs/data-sources.md). There is
  # no key to confirm this against, so this is UNKNOWN rather than a guess;
  # ui-credits.ts skips rendering any entry whose source_id is UNKNOWN.
  admin_lines:
    label: Natural Earth Admin Lines
    source: Natural Earth
    url: https://www.naturalearthdata.com/about/terms-of-use/
    licence: Public domain
    source_id: UNKNOWN

  # docs/layers/westtec-10yr.md's Source table carries no License field, and
  # docs/data-sources.md defers to "See layer doc Caveats" — a Caveats
  # section the layer doc does not have. The licence cannot be confirmed
  # against either allowed reference.
  westtec_10yr:
    label: WestTEC 10 Yr
    source: WestTEC, a Western Power Pool initiative
    url: https://www.westernpowerpool.org/
    licence: UNKNOWN
    source_id: westtec
