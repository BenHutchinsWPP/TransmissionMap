<title id="title">How the line routing cube becomes a route</title>
<desc id="desc">Six groups of public data are filtered and aligned to a 250 metre grid. The routing cube stores mapped conditions. Published methods and TransmissionMap choices supply separate routing weights and construction cost assumptions. Reference cards link to sources.</desc>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F8FA" stroke="none"/>
<rect x="0" y="0" width="1920" height="12" rx="0" fill="#007D78" stroke="none"/>
<text x="60" y="78" font-family="Noto Sans,Arial,sans-serif" font-size="46" font-weight="700" fill="#173344">How the line routing cube becomes a route</text>
<text x="60" y="123" font-family="Noto Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#536876">TransmissionMap  /  Public data / A shared 250 m grid / Weighted routing and a separate cost estimate</text>
<text x="60" y="191" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#007D78">1  Public data sources</text>
<text x="630" y="191" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#007D78">2  Prepare the data</text>
<text x="990" y="191" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#007D78">3  Store the cube</text>
<text x="1340" y="191" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#007D78">4  Apply a method</text>
<rect x="60" y="220" width="520" height="69" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<rect x="60" y="220" width="5" height="69" rx="0" fill="#007D78" stroke="none"/>
<text x="78" y="244" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#173344">Land cover &amp; terrain</text>
<text x="78" y="265" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">USGS / MRLC Annual NLCD; USGS 3DEP</text>
<rect x="60" y="297" width="520" height="69" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<rect x="60" y="297" width="5" height="69" rx="0" fill="#007D78" stroke="none"/>
<text x="78" y="321" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#173344">Conservation &amp; wildlife</text>
<text x="78" y="342" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">USGS PAD-US; USFWS habitat + wetlands;</text>
<text x="78" y="363" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">BLM; NPS trails; Wild &amp; Scenic Rivers; TNC / PoPWest</text>
<rect x="60" y="374" width="520" height="69" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<rect x="60" y="374" width="5" height="69" rx="0" fill="#007D78" stroke="none"/>
<text x="78" y="398" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#173344">Communities &amp; sensitive places</text>
<text x="78" y="419" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">FEMA / ORNL USA Structures; WorldPop;</text>
<text x="78" y="440" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">HIFLD facilities; NPS historic properties</text>
<rect x="60" y="451" width="520" height="69" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<rect x="60" y="451" width="5" height="69" rx="0" fill="#007D78" stroke="none"/>
<text x="78" y="475" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#173344">Hazards &amp; restricted areas</text>
<text x="78" y="496" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">USFS wildfire; EPA floodplain + Superfund;</text>
<text x="78" y="517" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">Census / BIA tribal land; DoD; FAA; USGS / USACE</text>
<rect x="60" y="528" width="520" height="69" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<rect x="60" y="528" width="5" height="69" rx="0" fill="#007D78" stroke="none"/>
<text x="78" y="552" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#173344">Networks &amp; existing corridors</text>
<text x="78" y="573" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">OSM + HIFLD lines, roads, rivers, pipelines;</text>
<text x="78" y="594" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">BTS rail; DOE / ANL Section 368 corridors</text>
<rect x="60" y="605" width="520" height="69" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<rect x="60" y="605" width="5" height="69" rx="0" fill="#007D78" stroke="none"/>
<text x="78" y="629" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#173344">Regional &amp; land-value context</text>
<text x="78" y="650" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">EIA balancing authorities; Census boundaries;</text>
<text x="78" y="671" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">USDA NASS county agricultural land values</text>
<rect x="630" y="220" width="310" height="454" rx="14" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="650" y="258" font-family="Noto Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#173344">Collect &amp; filter</text>
<text x="650" y="288" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">Select source classes, status</text>
<text x="650" y="316" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">and relevant features.</text>
<text x="650" y="363" font-family="Noto Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#173344">Align to one grid</text>
<text x="650" y="393" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">Reproject to CONUS Albers;</text>
<text x="650" y="421" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">aggregate or rasterize at 250 m.</text>
<text x="650" y="468" font-family="Noto Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#173344">Derive cell attributes</text>
<text x="650" y="498" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">Slope bins, buffers, wetland</text>
<text x="650" y="526" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">shares, homes, line adjacency.</text>
<text x="650" y="573" font-family="Noto Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#173344">Check &amp; package</text>
<text x="650" y="603" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">Verify grid and band definitions;</text>
<text x="650" y="631" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">retain sources, dates and licences.</text>
<polyline points="588,449 619,449" fill="none" stroke="#007D78" stroke-width="3"/>
<polygon points="619,449 608.3560609266486,454.5413501064978 608.3560609266486,443.4586498935022" fill="#007D78"/>
