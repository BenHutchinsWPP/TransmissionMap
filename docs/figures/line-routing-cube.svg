<rect x="990" y="283" width="280" height="302" rx="12" fill="#FFFFFF" stroke="#79A9A5"/>
<text x="1012" y="331" font-family="Noto Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#007D78">Routing cube</text>
<text x="1012" y="374" font-family="Noto Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#173344">250 m × 250 m cells</text>
<text x="1012" y="405" font-family="Noto Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#173344">Contiguous United States</text>
<text x="1012" y="455" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#536876">19 federal / other bands</text>
<text x="1012" y="484" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#536876">+ 3 OSM-derived bands</text>
<text x="1012" y="513" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#536876">in separate raster files</text>
<text x="1009" y="612" font-family="Noto Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#007D78">Mapped conditions</text>
<text x="1009" y="642" font-family="Noto Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#536876">Weights applied later</text>
<polyline points="1292,449 1310,449 1310,322 1330,322" fill="none" stroke="#007D78" stroke-width="3"/>
<polygon points="1330,322 1319.3560609266485,327.5413501064978 1319.3560609266485,316.4586498935022" fill="#007D78"/>
<polyline points="1310,449 1310,565 1330,565" fill="none" stroke="#2865A8" stroke-width="3"/>
<polygon points="1330,565 1319.3560609266485,570.5413501064978 1319.3560609266485,559.4586498935022" fill="#2865A8"/>
<rect x="1340" y="220" width="520" height="209" rx="14" fill="#E4F2EF" stroke="#B8D9D3"/>
<text x="1362" y="258" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#007D78">Routing preferences: path</text>
<text x="1362" y="297" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#173344">Apply avoidance, barriers and corridor discounts.</text>
<text x="1362" y="330" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#173344">Dijkstra search minimizes weight × distance.</text>
<text x="1362" y="363" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#173344">Return a route, alternatives and similar-cost areas.</text>
<text x="1362" y="407" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#007D78">User choices: endpoints, line type and method</text>
<rect x="1340" y="452" width="520" height="222" rx="14" fill="#EAF0F9" stroke="#C9D7EB"/>
<text x="1362" y="491" font-family="Noto Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#2865A8">Construction assumptions: dollars</text>
<text x="1362" y="529" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#173344">Price the routed line with base $/mile and factors.</text>
<text x="1362" y="562" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#173344">Add right-of-way, mitigation and terminals;</text>
<text x="1362" y="595" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#173344">apply markups, contingency and escalation.</text>
<text x="1362" y="647" font-family="Noto Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#2865A8">Rough early estimate in 2025$: -30% / +50%</text>
<rect x="60" y="702" width="1800" height="53" rx="10" fill="#173344" stroke="none"/>
<text x="82" y="736" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Weights shape the route. Cost multipliers price it. A routing penalty is not a dollar cost.</text>
<text x="60" y="797" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173344">Main sources for weights and methodology</text>
<text x="1178" y="797" font-family="Noto Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#536876">Published inputs + TransmissionMap adaptations</text>
<rect x="60" y="820" width="285" height="135" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="74" y="849" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#007D78">Wu et al. · PNAS 2023</text>
<text x="74" y="883" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">250 m least-cost framework;</text>
<text x="74" y="908" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">environmental categories,</text>
<text x="74" y="933" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">wildfire and terminal rules.</text>
<rect x="363" y="820" width="285" height="135" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="377" y="849" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#2865A8">B&amp;V / WECC · 2014</text>
<text x="377" y="883" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">Base line and station costs;</text>
<text x="377" y="908" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">terrain / land-cover factors,</text>
<text x="377" y="933" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">markups and short-line rules.</text>
<rect x="666" y="820" width="285" height="135" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="680" y="849" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#2865A8">NREL reVX / Lopez 2025</text>
<text x="680" y="883" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">Regional construction factors</text>
<text x="680" y="908" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">for land cover and slope;</text>
<text x="680" y="933" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">least-cost modelling practice.</text>
<rect x="969" y="820" width="285" height="135" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="983" y="849" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#007D78">EPRI–GTC / utility filings</text>
<text x="983" y="883" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">Siting suitability; preference</text>
<text x="983" y="908" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">for existing corridors; homes</text>
<text x="983" y="933" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">and sensitive-site proximity.</text>
<rect x="1272" y="820" width="285" height="135" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="1286" y="849" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#2865A8">SWCA / WECC · 2013</text>
<text x="1286" y="883" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">Environmental mitigation</text>
<text x="1286" y="908" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">percentages by risk class</text>
<text x="1286" y="933" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">and California / other areas.</text>
<rect x="1575" y="820" width="285" height="135" rx="10" fill="#FFFFFF" stroke="#DCE5EA"/>
<text x="1589" y="849" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#2865A8">MISO · MTEP25 / 26</text>
<text x="1589" y="883" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">ROW widths and land method;</text>
<text x="1589" y="908" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">contingency, escalation and</text>
<text x="1589" y="933" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#536876">lower-voltage cost ratios.</text>
<text x="60" y="994" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#173344">TransmissionMap sets additional penalties, thresholds and combination rules; assumptions are cited and editable in the Method tab.</text>
<text x="60" y="1028" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#536876">Screening at 250 m. Coverage and dates vary. Observed footprint bands apply only where processed and are neutral by default.</text>
<text x="60" y="1058" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#536876">Engineering, permitting and tribal consent require project review. Source detail: docs/routing.md and src/registry/route-presets.ts</text>
