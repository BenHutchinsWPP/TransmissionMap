  <iframe sandbox="allow-scripts">: elsewhere it stays inert.

<script>// --- Canvas runner (inline in public/canvas.html) ---------------------------

//       inside an opaque-origin <iframe sandbox="allow-scripts"> whose own meta
//       CSP (built by scripts/build_sandbox.mjs) admits inline code, eval, the
//       three CDNs (cdnjs, jsDelivr, unpkg), Google Fonts and the basemap tile
//       hosts in src/registry/canvas-hosts.json, and nothing else. The frame
//       holds no secret; what it shows is the model's, and the page draws the
//       frame around it.
//       It runs only when its origin is opaque ('null') and it is framed: the
//       same file opened top-level, or framed without the sandbox attribute,
//       has the app's origin and stays inert (no listener, no post).
//       Protocol (every frame -> parent post uses targetOrigin '*'; only
//       messages whose source is window.parent are read):
//         on load  -> {type:'ready'}
//         parent {type:'render', nonce: string 16-64 chars, kind: 'html'|'vega',
//                 payload, inputs?, width?, height?, actions?}
//                  - the first well-formed one is taken; every later message
//                    is ignored except {type:'png', nonce} and {type:'actions-reset', nonce} on a vega frame.
//         kind 'html': payload = the page, a string of <= 60,000 chars (over ->
//                  {type:'error', nonce, category:'too-large'}). The runner
//                  calls document.open() (same Document, so the CSP stays),
//                  re-installs its error capture (open() drops listeners),
//                  installs memory-only localStorage/sessionStorage, a string
//                  document.cookie and an empty `caches`, sets the deep-frozen
//                  window.TM_INPUT (= inputs, or {}) and window.TM.download,
//                  then document.write(payload); document.close().
//                  -> {type:'rendered', nonce} once the written page has loaded
//                  -> {type:'error', nonce, category:'syntax'|'runtime'|'csp',
//                     message: <= 300 chars} for each error (capped at 20)
//                  A page that defines window.maplibregl gets its worker pointed at
//                  the same version's worker file (blob workers have an opaque origin).
//                  TM.download(name, mime, data: string|ArrayBuffer|view)
//                  -> {type:'download', nonce, name, mime, data}
//                  TM.drawn() -> {type:'drawn', nonce}, once: a template calls it
//                     after its real first paint (MapLibre 'idle', deck's first
//                     frame); the page counts it, not 'rendered', for a template.
//                  TM.fail(category, message?) -> {type:'error', nonce, category:
//                     'library'|'unavailable'|'runtime'|'invalid-data' (any other:
//                     'runtime'), message <= 300}: a library that did not load, bad data.
//                  TM.action(kind, payload) -> {type:'action', nonce, kind, payload}:
//                     kind 'select'|'fly'|'table'|'where' (else TypeError), payload
//                     plain JSON (re-parsed) of <= 65,536 chars (else it throws). The
//                     runner only forwards; the page reads actions only from the
//                     frames it made for its own templates and validates each.
//                  TM.lib(name) -> Promise: loads that entry of the libs table
//                     (src/registry/template-libs.json) once, as a script element
//                     with src, integrity and crossorigin, a stylesheet link (kind
//                     style) or import() under an import map carrying its integrity
//                     (kind module); resolves when loaded (a module: its namespace),
//                     rejects on an unknown name, a network or an SRI failure, so
//                     the template can call TM.fail('library'). d3-sankey and
//                     plot extend the d3 global: load d3 first.
//                  A script or link element the written page names whose url is in the
//                  libs table and fails to load -> {type:'error', nonce,
//                  category:'library', message} (a capturing error listener
//                  on document; element errors do not bubble).
//                  The page's code shares this realm, so every message after
//                  the write may be forged by it: the page validates them all.
//         kind 'vega': payload = a Vega-Lite spec object, data already in it;
//                  actions? = [{signal, kind, layer, field, read}] (the page sends
//                  it only to the frames it made for its own templates; <= 8,
//                  each a name and short strings, else dropped): once the
//                  chart has rendered, a change of that signal (a selection)
//                  whose `read` field holds a value (a string <= 200 chars or a
//                  finite number) posts the newly added value, debounced 250 ms,
//                  as {type:'action', nonce, kind, payload: {layer, field, bin}},
//                  unless it is the value posted last; an emptied selection
//                  posts nothing and forgets the last value. parent
//                  {type:'actions-reset', nonce} makes the runner forget the
//                  last value, so the same group can be applied again.
//                  A signal the chart lacks is skipped.
//                  The runner loads the pinned vega, vega-lite (UMD) and
//                  vega-interpreter (ES module, through an import map) from
//                  jsDelivr with SRI (the libs table), refuses any url/href/element/datasets/
//                  usermeta key, or object-valued format key, outside
//                  data.values rows, forces config.events = {selector: false,
//                  window: false}, and renders to a canvas with the expression
//                  interpreter and a loader that refuses every load.
//                  -> {type:'rendered', nonce}
//                  -> {type:'error', nonce, category:'invalid-spec', message <= 300}
//                  -> {type:'error', nonce, category:'library', message} when
//                     the libraries do not load
//                  parent {type:'png', nonce}
//                  -> {type:'download', nonce, name:'chart.png', mime:'image/png',
//                     data: ArrayBuffer}
//       One IIFE with no top-level names: document.open() keeps the Window, so
//       a runner global would collide with the written page's own. The only
//       globals it sets are TM_INPUT, TM and the shims. RTCPeerConnection is
//       replaced with a throwing stub on the html path; that is best effort
//       (a child about:blank frame still has one), not a boundary.
//       Plain JS, no imports: scripts/build_sandbox.mjs replaces the LIBS
//       placeholder with src/registry/template-libs.json as
//       {name: {url, integrity, kind}}.
//
// Deps: none (LIBS is filled in by the build).

        view.addSignalListener(a.signal, function (_name, value) {
          clearTimeout(timer);
          var cur = pickedValues(value, a.read);
          var added = cur.filter(function (x) { return prev.indexOf(x) < 0; });
          prev = cur;
          if (!cur.length) last = undefined;
          if (!added.length) return;
          var bin = added[added.length - 1];
          if (bin === last) return;
          timer = setTimeout(function () {
            last = bin;
            post({ type: 'action', nonce: n, kind: a.kind, payload: { layer: a.layer, field: a.field, bin: bin } });
          }, SIGNAL_MS);
        });
        resets.push(function () { last = undefined; prev = []; });
      } catch (_) { /* the chart has no such signal */ }
    });
  }

  function vega(spec, width, height, actions) {
    var n = nonce, fitSize = null;
    var box = document.createElement('div');
    box.style.width = width ? width + 'px' : '100%';
    if (height) box.style.height = height + 'px';
    document.body.appendChild(box);
    try { checkKeys(spec); } catch (err) {
      post({ type: 'error', nonce: n, category: 'invalid-spec', message: clip(err.message) });
      return Promise.resolve(null);
    }
    var libs;
    try {
      libs = loadLib('vega').then(function () { return loadLib('vega-lite'); })
        .then(function () { return loadLib('vega-interpreter'); })
        .then(function (mod) { return mod.expressionInterpreter; });
    } catch (err) { libs = Promise.reject(err); }
    return libs.then(function (interpreter) {
      var view;
      try {
        if (spec.mark || spec.layer) {
          // A single or layered chart fits the frame, axes, legend and title included; a
          // smaller numeric width/height of the model's own is kept. Facet/concat specs size
          // naturally and the frame scrolls.
          var own = { width: spec.width, height: spec.height };
          fitSize = function () {
            return {
              width: Math.min(width || innerWidth, typeof own.width === 'number' ? own.width : Infinity),
              height: Math.min(height || innerHeight, typeof own.height === 'number' ? own.height : Infinity),
            };
          };
          var fs = fitSize();
          spec.width = fs.width; spec.height = fs.height;
          spec.autosize = { type: 'fit', contains: 'padding' };
          document.documentElement.style.overflow = 'hidden';
        }
        var vg = self.vegaLite.compile(spec).spec;
        var config = vg.config && typeof vg.config === 'object' ? vg.config : {};
        config.events = Object.assign({}, config.events, { selector: false, window: false });
        vg.config = config;
        var runtime = self.vega.parse(vg, null, { ast: true });
        view = new self.vega.View(runtime, {
          expr: interpreter,
          loader: { load: refuse, sanitize: refuse, http: refuse, file: refuse },
          renderer: 'canvas',
          container: box,
          hover: true,
        });
      } catch (err) {
        post({ type: 'error', nonce: n, category: 'invalid-spec', message: clip(err && err.message || err) });
        return null;
      }
      return view.runAsync().then(function () {
        if (fitSize) {
          addEventListener('resize', function () {
            var fs = fitSize();
            view.width(fs.width).height(fs.height).runAsync().catch(function () {});
          });
        }
        if (actions.length) bridge(view, actions);
        post({ type: 'rendered', nonce: n });
        return view;
      }, function (err) {
        post({ type: 'error', nonce: n, category: 'invalid-spec', message: clip(err && err.message || err) });
        return null;
      });
    }, function (err) {
      post({ type: 'error', nonce: n, category: 'library', message: clip(err && err.message || err) });
      return null;
    });
  }

  function png() {
    var n = nonce;
    vegaJob.then(function (view) {
      if (!view) return;
      return view.toImageURL('png', 2).then(function (url) {
        var bin = atob(url.slice(url.indexOf(',') + 1));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        post({ type: 'download', nonce: n, name: 'chart.png', mime: 'image/png', data: bytes.buffer });
      });
    }).catch(function (err) {
      post({ type: 'error', nonce: n, category: 'runtime', message: clip(err && err.message || err) });
    });
  }

  post({ type: 'ready' });
})();
</script>
